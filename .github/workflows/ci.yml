# GitHealthCheck's CI: format, vet, tests (including the git hardening tests, which run real git
# against hostile repository config), govulncheck, and the GitHub Action on Linux and macOS. Same security model as Helmbulance's CI: runs on
# pull_request, never pull_request_target; read-only token; no secrets, no caches; actions pinned by
# commit SHA.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: fmt, vet, test, govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: build for every release OS
        run: for os in linux darwin windows; do GOOS=$os go build ./... || exit 1; done
      # The Python tests use the runner's python3 (3.12 on ubuntu-24.04), and fail rather than skip
      # without one.
      - run: python3 --version
      - run: go test -race ./...
        env:
          GHC_REQUIRE_PYTHON: "1"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Needs root to give a test repository another owner; last, because it writes the build cache as
      # root.
      - name: safe.directory test as root
        run: sudo -E env "PATH=$PATH" go test -count=1 -run TestSafeDirectoryForOtherOwner -v ./internal/execx/

  release-config:
    name: goreleaser check and snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: check
      # Builds every archive without publishing, so a broken release config fails here and not on a tag.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=before
      - name: the snapshot binary runs and scans this repository
        run: |
          bin=$(find dist -path '*linux_amd64*' -name githealthcheck -type f | head -1)
          "$bin" version
          "$bin" scan --format json . > /dev/null || [ $? -eq 1 ]

  action:
    name: action on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      # gh attestation verify reads this repository's attestations.
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The action on this checkout, built from source: the released binaries predate the action's flags.
      - id: ghc
        uses: ./
        with:
          version: source
          upload-sarif: "false"
          fail-on: never
      - name: the action wrote its reports and outputs
        env:
          CODE: ${{ steps.ghc.outputs.exit-code }}
          VERDICT: ${{ steps.ghc.outputs.verdict }}
          SCORE: ${{ steps.ghc.outputs.score }}
          DIR: ${{ steps.ghc.outputs.report-dir }}
        run: |
          echo "exit $CODE, verdict $VERDICT, score $SCORE"
          case "$CODE:$VERDICT" in 0:PASS | 1:FAIL) ;; *) exit 1 ;; esac
          [ -n "$SCORE" ]
          jq -e '.version == "2.1.0" and (.runs[0].results | length) > 0' "$DIR/report.sarif" > /dev/null
          jq -e '.overall.score.value != null' "$DIR/report.json" > /dev/null
          grep -q '^## githealthcheck: ' "$DIR/report.md"
      # The release download path, on the latest published release: checksum and provenance.
      - name: install.sh installs and verifies a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          action/install.sh "$RUNNER_TEMP/released" v0.2.0 true
          if action/install.sh "$RUNNER_TEMP/bad" v0.2 false; then exit 1; fi
