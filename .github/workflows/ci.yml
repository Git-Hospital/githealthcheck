# GitHealthCheck's CI: format, vet, tests (including the git hardening tests, which run real git
# against hostile repository config) and govulncheck. Same security model as Helmbulance's CI: runs on
# pull_request, never pull_request_target; read-only token; no secrets, no caches; actions pinned by
# commit SHA.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: fmt, vet, test, govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: build for every release OS
        run: for os in linux darwin windows; do GOOS=$os go build ./... || exit 1; done
      # The Python tests use the runner's python3 (3.12 on ubuntu-24.04), and fail rather than skip
      # without one.
      - run: python3 --version
      - run: go test -race ./...
        env:
          GHC_REQUIRE_PYTHON: "1"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Needs root to give a test repository another owner; last, because it writes the build cache as
      # root.
      - name: safe.directory test as root
        run: sudo -E env "PATH=$PATH" go test -count=1 -run TestSafeDirectoryForOtherOwner -v ./internal/execx/

  release-config:
    name: goreleaser check and snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: check
      # Builds every archive without publishing, so a broken release config fails here and not on a tag.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --snapshot --clean --skip=before
      - name: the snapshot binary runs and scans this repository
        run: |
          bin=$(find dist -path '*linux_amd64*' -name githealthcheck -type f | head -1)
          "$bin" version
          "$bin" scan --format json . > /dev/null || [ $? -eq 1 ]
